[package]
name = "virtual-audio-mixer-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["clock"] }
coreaudio-sys = "0.2.16"
cpal = "0.17.3"
hound = "3.5.1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
